# 18-11-2026: reglas para Nginx (VPS). Nginx no lee los .htaccess: estas reglas hacen lo mismo.
# Uso: dentro del bloque "server { ... }" del sitio, antes de "location /" y "location ~ \.php$":
#     include /ruta/del/proyecto/docker/nginx-seguridad.conf;

# Archivos y carpetas ocultos (.git, .claude, .env, .htaccess...), menos .well-known (certificado https)
location ~ /\.(?!well-known(/|$)) { return 404; }

# Carpetas del sistema que no se sirven: código, respaldos, scripts SQL e instaladores (se descargan por la app)
location ~* ^/(application|system|instaladores|sql|tests)(/|$) { return 404; }
location ~* /_respaldos[^/]*(/|$) { return 404; }
# v1.27.0: respaldos de las bases (Configuraciones > Respaldos)
location ~* ^/backups(/|$) { return 404; }

# Archivos de configuración y documentación del proyecto
location ~* ^/(docker-compose\.ya?ml|composer\.(json|lock)|readme\.rst|license\.txt|c\.txt)$ { return 404; }

# Tipos que nunca son parte de la página
location ~* \.(sql|bak|old|orig|swp|log|sh|bat|ps1|key|pem|env|ini|dist|dump)$ { return 404; }

# uploads/: solo imágenes, nunca se ejecuta código desde ahí
location ~* ^/uploads/.*\.(php[0-9]?|phtml|phar|pl|py|cgi)$ { return 404; }

# No anunciar la versión de Nginx
server_tokens off;
