# 18-11-2026: configuración de Apache para el contenedor (docker-compose.yml la monta en conf-enabled).
# La imagen php:apache trae AllowOverride None: Apache ignoraba los .htaccess del proyecto (application/, uploads/,
# instaladores/ y el de la raíz), así que se podían ver el historial de git, los respaldos y los scripts SQL.

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Las mismas reglas del .htaccess de la raíz, aquí también por si alguien borra ese archivo
RedirectMatch 404 "(?i)(^|/)\.(?!well-known(/|$))"
RedirectMatch 404 "(?i)(^|/)_respaldos[^/]*(/|$)"
RedirectMatch 404 "(?i)(^|/)sql(/|$)"
RedirectMatch 404 "(?i)/(docker-compose\.ya?ml|composer\.(json|lock)|readme\.rst|license\.txt|c\.txt)$"
RedirectMatch 404 "(?i)\.(sql|bak|old|orig|swp|log|sh|bat|ps1|key|pem|env|ini|dist)$"
RedirectMatch 404 "(?i)^/(application|system|instaladores)(/|$)"

# No anunciar la versión de Apache ni de PHP
ServerTokens Prod
ServerSignature Off
