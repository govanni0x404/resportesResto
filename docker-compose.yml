services:
  web:
    image: php:7.4-apache
    container_name: mi_proyecto_web
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      # 18-11-2026: Apache lee los .htaccess y no deja ver .git, respaldos ni scripts SQL (docker/apache-seguridad.conf)
      - ./docker/apache-seguridad.conf:/etc/apache2/conf-enabled/zz-seguridad.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "apt-get update && apt-get install -y libpq-dev 
      && docker-php-ext-install pgsql pdo_pgsql
      && apache2-foreground"